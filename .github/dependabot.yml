# Weekly checks for security fixes and updates in the Python, npm and GitHub Actions
# dependencies. Minor and patch updates are grouped into one PR per ecosystem to keep the
# noise down; major updates come as their own PRs so a breaking one can't hide in a batch.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # typescript-eslint only supports the TypeScript versions it lists as a peer
      # dependency, so a TypeScript major breaks `npm ci`. Bump it by hand once
      # typescript-eslint supports the new version.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
