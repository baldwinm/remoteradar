# Render Blueprint matching the live setup: one native Python web service that builds the
# frontend and serves it together with the API from the same origin. Render reads the Python
# and Node versions from .python-version and .node-version.
# Render asks for the API keys when the Blueprint is created (sync: false keeps them out of this file).
services:
  - type: web
    name: remote-radar
    runtime: python
    plan: starter
    # Popular-city totals (backend/app/services/popular.py) are kept in data/popular.db on this disk.
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 5
    buildCommand: cd frontend && npm ci --include=dev && npm run build && cd ../backend && pip install -r requirements.txt
    # backend/gunicorn.conf.py sets the worker class, port and proxy settings.
    startCommand: cd backend && gunicorn wsgi:app
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: OPENCAGE_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
