[project]
name = "remoteradar-backend"
version = "2.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "ASYNC", "RUF"]
ignore = [
    "B008",   # FastAPI's Depends() in argument defaults is the intended pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "E501"]
